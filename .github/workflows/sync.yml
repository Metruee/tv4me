name: sync-spiders

on:
  schedule:
    - cron: "0 18 * * *"      # UTC 18:00 = 北京 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装运行时依赖
        run: cd scripts && npm install --no-audit --no-fund axios cheerio crypto-js
      - name: 同步上游并重新生成
        env:
          MAX_KB: "200"
        run: python3 scripts/sync_upstream.py
      - name: 提交
        run: |
          git config user.name  "tv4me-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "auto: sync spiders $(date -u +%F)" || echo "无变化"
          git push
